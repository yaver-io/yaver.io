[platformio]
default_envs = m5stack-atoms3u

[env:m5stack-atoms3u]
platform = espressif32@6.12.0
# M5Stack's own AtomS3U guide maps the board to the generic DevKitC target.
# Keeping that mapping here also makes the build work on stock PlatformIO
# espressif32, whose older stable registry has no atoms3u alias.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DYAVER_KVM_VERSION=\"0.1.1\"
lib_deps =
  bblanchon/ArduinoJson@7.4.2
