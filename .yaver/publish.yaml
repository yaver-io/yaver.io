version: 2
project: yaver
defaultTarget: npm-cli
fallback:
  githubAllowed: true
  repo: kivanccakmak/yaver.io
  workflow: yaver-publish.yml
  ref: main
targets:
  - id: npm-cli
    label: npm (cli)
    kind: npm
    workDir: cli
    uploader: yaver
    submitter: yaver
    publishCommand: PKG_FILE="$(npm pack | tail -n 1)" && npm publish "$PKG_FILE" --access public
    artifactGlobs:
      - '*.tgz'
    envFromVault:
      NODE_AUTH_TOKEN: npm-token
    envFromGitHub:
      NODE_AUTH_TOKEN: NPM_TOKEN
    requiresConfirmation: true
    identity:
      packageName: yaver-cli
    postconditions:
      - kind: npm-version-visible
  - id: npm-sdk-errors-js
    label: npm (sdk/errors-js)
    kind: npm
    workDir: sdk/errors-js
    uploader: yaver
    submitter: yaver
    publishCommand: PKG_FILE="$(npm pack | tail -n 1)" && npm publish "$PKG_FILE" --access public
    artifactGlobs:
      - '*.tgz'
    envFromVault:
      NODE_AUTH_TOKEN: npm-token
    envFromGitHub:
      NODE_AUTH_TOKEN: NPM_TOKEN
    requiresConfirmation: true
    identity:
      packageName: yaver-errors
    postconditions:
      - kind: npm-version-visible
  - id: npm-sdk-js
    label: npm (sdk/js)
    kind: npm
    workDir: sdk/js
    uploader: yaver
    submitter: yaver
    publishCommand: PKG_FILE="$(npm pack | tail -n 1)" && npm publish "$PKG_FILE" --access public
    artifactGlobs:
      - '*.tgz'
    envFromVault:
      NODE_AUTH_TOKEN: npm-token
    envFromGitHub:
      NODE_AUTH_TOKEN: NPM_TOKEN
    requiresConfirmation: true
    identity:
      packageName: yaver-sdk
    postconditions:
      - kind: npm-version-visible
  - id: npm-feedback-react-native
    label: npm (sdk/feedback/react-native)
    kind: npm
    workDir: sdk/feedback/react-native
    uploader: yaver
    submitter: yaver
    publishCommand: PKG_FILE="$(npm pack | tail -n 1)" && npm publish "$PKG_FILE" --access public
    artifactGlobs:
      - '*.tgz'
    envFromVault:
      NODE_AUTH_TOKEN: npm-token
    envFromGitHub:
      NODE_AUTH_TOKEN: NPM_TOKEN
    requiresConfirmation: true
    identity:
      packageName: yaver-feedback-react-native
    postconditions:
      - kind: npm-version-visible
  - id: npm-feedback-web
    label: npm (sdk/feedback/web)
    kind: npm
    workDir: sdk/feedback/web
    uploader: yaver
    submitter: yaver
    publishCommand: PKG_FILE="$(npm pack | tail -n 1)" && npm publish "$PKG_FILE" --access public
    artifactGlobs:
      - '*.tgz'
    envFromVault:
      NODE_AUTH_TOKEN: npm-token
    envFromGitHub:
      NODE_AUTH_TOKEN: NPM_TOKEN
    requiresConfirmation: true
    identity:
      packageName: yaver-feedback-web
    postconditions:
      - kind: npm-version-visible
  - id: pypi-sdk-python
    label: PyPI (sdk/python)
    kind: pypi
    workDir: sdk/python
    uploader: yaver
    submitter: yaver
    publishCommand: python -m build && python -m twine upload dist/*
    artifactGlobs:
      - dist/*
    env:
      TWINE_USERNAME: __token__
    envFromVault:
      TWINE_PASSWORD: pypi-token
    envFromGitHub:
      TWINE_PASSWORD: PYPI_TOKEN
    requiresConfirmation: true
    identity:
      packageName: yaver
    postconditions:
      - kind: pypi-version-visible
  - id: pubdev-feedback-flutter
    label: pub.dev (sdk/feedback/flutter)
    kind: pubdev
    workDir: sdk/feedback/flutter
    uploader: yaver
    submitter: yaver
    prepareCommand: if [ -n "$PUB_TOKEN" ]; then dart pub token add https://pub.dev --env-var PUB_TOKEN; fi
    publishCommand: flutter pub publish --force
    runnerLabels:
      - self-hosted
      - macOS
    envFromGitHub:
      PUB_TOKEN: PUB_TOKEN
    requiresConfirmation: true
    identity:
      packageName: yaver_feedback
    postconditions:
      - kind: pubdev-version-visible
  - id: pubdev-sdk-flutter
    label: pub.dev (sdk/flutter)
    kind: pubdev
    workDir: sdk/flutter
    uploader: yaver
    submitter: yaver
    prepareCommand: if [ -n "$PUB_TOKEN" ]; then dart pub token add https://pub.dev --env-var PUB_TOKEN; fi
    publishCommand: flutter pub publish --force
    runnerLabels:
      - self-hosted
      - macOS
    envFromGitHub:
      PUB_TOKEN: PUB_TOKEN
    requiresConfirmation: true
    identity:
      packageName: yaver
    postconditions:
      - kind: pubdev-version-visible
  - id: testflight-mobile
    label: TestFlight (mobile)
    kind: custom
    workDir: .
    uploader: yaver
    submitter: yaver
    publishCommand: ./deploy/deploy.sh ios
    runnerLabels:
      - self-hosted
      - macOS
    requiresConfirmation: true
    identity:
      bundleId: io.yaver.mobile
      track: testflight
    postconditions:
      - kind: apple-upload-log-accepted
  - id: playstore-mobile
    label: Play Internal (mobile)
    kind: custom
    workDir: .
    uploader: yaver
    submitter: yaver
    publishCommand: ./deploy/deploy.sh android
    requiresConfirmation: true
    identity:
      packageName: io.yaver.mobile
      track: internal
    postconditions:
      - kind: google-edit-committed
