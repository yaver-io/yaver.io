server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name public.yaver.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/public.yaver.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/public.yaver.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/yaver-relay-access.log yaver_relay;
    client_max_body_size 16m;
    client_body_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;

    location = /health {
        access_log off;
        limit_req zone=yaver_relay_per_ip burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Administrative inventory is local-only even when the application layer
    # also requires an admin token.
    location = /tunnels {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    location ^~ /admin/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        limit_req zone=yaver_relay_per_ip burst=60 nodelay;
        limit_conn yaver_relay_connections 24;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_yaver;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward the per-account relay credential supplied by Yaver clients.
        # Clearing this header makes every authenticated request fail as
        # relay_password_missing before it can reach a registered tunnel.
        proxy_set_header X-Relay-Password $http_x_relay_password;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 620s;
        add_header X-Accel-Buffering no always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name public.yaver.io;
    return 301 https://$host$request_uri;
}
