name: Release Desktop GUI

on:
  push:
    tags:
      - "gui/v*"
  workflow_dispatch:
    inputs:
      skip_agent_bundle:
        description: "Skip downloading the agent binary into the bundle (debug builds)."
        type: boolean
        default: false
        required: false

# Only repo owner can push tags (configure tag protection rules in GitHub).
# Release jobs require the "production" environment.

concurrency:
  group: release-gui
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract and validate version
        id: version
        run: |
          JSON_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('versions.json','utf8')).gui)")
          if [[ "$GITHUB_REF" == refs/tags/gui/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/gui/v}"
            if [ "$TAG_VERSION" != "$JSON_VERSION" ]; then
              echo "ERROR: Tag version ($TAG_VERSION) does not match versions.json ($JSON_VERSION)"
              exit 1
            fi
          else
            TAG_VERSION="$JSON_VERSION"
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $TAG_VERSION"

  test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install
        working-directory: electron
        run: npm ci
      - name: Unit tests (navigation policy, auth interceptor, agent manager)
        working-directory: electron
        run: npm test

  build:
    needs: [validate, test]
    # Signing/notarization credentials are repository-scoped because tag refs
    # are intentionally excluded by the production environment's branch rule.
    # The non-exportable SimplySign identity lives on the release Mac. Windows
    # Store candidates are built through ./deploy/deploy.sh desktop-windows;
    # hosted CI must never substitute an unsigned installer.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest moved to macOS 26 and electron-builder 26.15.3 can
          # fail while unlocking its temporary signing keychain there. Keep
          # the signed arm64 release lane on the proven macOS 15 image.
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install
        working-directory: electron
        run: npm ci
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenjp2-tools rpm
      - name: Setup Go for the native SSH helper
        uses: actions/setup-go@v5
        with:
          go-version-file: mobile/native/plain-ssh/core/go.mod
          cache-dependency-path: mobile/native/plain-ssh/core/go.sum
      - name: Build native SSH helper
        working-directory: electron
        run: node scripts/build-plain-ssh.mjs
      - name: Download agent binary into the bundle
        if: ${{ !inputs.skip_agent_bundle }}
        working-directory: electron
        run: node scripts/fetch-agent-binary.mjs
      - name: Write notarization key to file
        # @electron/notarize's APPLE_API_KEY env is a PATH to the .p8 file,
        # but the stored secret APP_STORE_CONNECT_API_KEY holds the p8
        # CONTENT (release-cli.yml writes it to a file too). Passing PEM
        # content as a path makes notarytool fail with "Invalid option".
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/notarize"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$RUNNER_TEMP/notarize/api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notarize/api_key.p8" >> "$GITHUB_ENV"
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

      - name: Package macOS
        if: matrix.platform == 'mac'
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" || -z "$APPLE_API_KEY" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
            echo "macOS Developer ID and notarization credentials are required; refusing an unsigned/unnotarized DMG." >&2
            exit 1
          fi
          npx electron-builder --mac --${{ matrix.arch }} --publish never
          app_path=$(find dist -type d -name Yaver.app -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type exec --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          test -x "$app_path/Contents/Resources/bin/yaver"
      - name: Package Windows (signed, standard-user install)
        if: matrix.platform == 'win'
        shell: pwsh
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CERTIFICATE_SHA1: ${{ vars.WIN_CERTIFICATE_SHA1 }}
        run: |
          if (([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) -and [string]::IsNullOrWhiteSpace($env:WIN_CERTIFICATE_SHA1)) {
            throw "Configure WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD or WIN_CERTIFICATE_SHA1 on the dedicated SimplySign runner. Refusing an unsigned Windows GUI."
          }
          ../scripts/windows-signing.ps1 -VerifyOnly -Path resources/bin/yaver.exe
          npx electron-builder --config electron-builder.windows.cjs --win --${{ matrix.arch }} --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE" }
      - name: Verify every shipped Windows executable is Authenticode-valid
        if: matrix.platform == 'win'
        shell: pwsh
        working-directory: electron
        env:
          WINDOWS_PUBLISHER_PATTERN: "(?i)simkab"
        run: |
          ../scripts/windows-signing.ps1 -VerifyOnly -Path dist

      - name: Operation-probe Microsoft Store silent install and uninstall
        if: matrix.platform == 'win'
        shell: pwsh
        working-directory: electron
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem dist -File -Filter "yaver-gui-*-win-x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows NSIS installer was produced" }
          $installRoot = Join-Path $env:RUNNER_TEMP "yaver-store-install-$env:GITHUB_RUN_ID"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installer exited $($process.ExitCode)" }
          $app = Join-Path $installRoot "Yaver.exe"
          $agent = Join-Path $installRoot "resources\bin\yaver.exe"
          if (-not (Test-Path -LiteralPath $app)) { throw "Silent install did not create $app" }
          if (-not (Test-Path -LiteralPath $agent)) { throw "Silent install did not embed $agent" }
          ../scripts/windows-signing.ps1 -VerifyOnly -Path $installRoot
          $uninstaller = Get-ChildItem $installRoot -File -Filter "Uninstall*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "Installed uninstaller was not found" }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstaller exited $($uninstall.ExitCode)" }
          if (Test-Path -LiteralPath $app) { throw "Silent uninstall left the installed app executable behind" }
      - name: Package Linux
        if: matrix.platform == 'linux'
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --linux --${{ matrix.arch }} --publish never
      - name: Verify Linux package contents and AppImage operation
        if: matrix.platform == 'linux'
        run: node scripts/verify-desktop-linux.mjs electron/dist ${{ matrix.arch }}
      - name: Stage macOS/Linux architecture update metadata
        if: matrix.platform != 'win'
        shell: bash
        working-directory: electron
        run: |
          mkdir -p dist/update-metadata
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            metadata=$(find dist -maxdepth 1 -type f -name 'latest-mac*.yml' -print -quit)
            test -n "$metadata"
            cp "$metadata" "dist/update-metadata/latest-${{ matrix.arch }}-mac.yml"
          else
            # electron-builder uses latest-linux.yml on x64 and
            # latest-linux-arm64.yml on arm64.
            metadata=$(find dist -maxdepth 1 -type f -name 'latest-linux*.yml' -print -quit)
            test -n "$metadata"
            cp "$metadata" "dist/update-metadata/latest-${{ matrix.arch }}-linux.yml"
          fi
      - name: Stage Windows architecture update metadata
        if: matrix.platform == 'win'
        shell: pwsh
        working-directory: electron
        run: |
          if (-not (Test-Path dist/latest.yml)) { throw "electron-builder did not produce latest.yml" }
          New-Item -ItemType Directory -Force dist/update-metadata | Out-Null
          Copy-Item dist/latest.yml "dist/update-metadata/latest-${{ matrix.arch }}.yml"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # macOS and Linux each have two architecture jobs. Artifact names
          # must be unique or the parallel upload jobs race and one gets a
          # 409 conflict before the release can merge them.
          name: yaver-gui-${{ matrix.platform }}-${{ matrix.arch }}
          # Installers only — explicitly exclude blockmaps (matched by
          # dist/yaver-gui-*) so the release stays clean. Multiline path
          # lists are the supported upload-artifact form (brace globs are not
          # minimatch; matrix multiline values collapse to the first line).
          path: |
            electron/dist/yaver-gui-*.AppImage
            electron/dist/yaver-gui-*.dmg
            electron/dist/yaver-gui-*.zip
            electron/dist/yaver-gui-*.exe
            electron/dist/yaver-gui-*.deb
            electron/dist/yaver-gui-*.rpm
            electron/dist/yaver-gui-*.tar.gz
            electron/dist/yaver-gui-*.blockmap
            electron/dist/yaver-gui-*.AppImage.zsync
            electron/dist/update-metadata/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/gui/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Write release checksums
        shell: bash
        run: |
          cd dist-artifacts
          # Architecture jobs stage updater manifests under a directory so
          # upload-artifact can collect them. Releases are flat assets.
          if [[ -d update-metadata ]]; then
            find update-metadata -maxdepth 1 -type f -exec mv {} . \;
            rmdir update-metadata
          fi
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt
          cat checksums.txt
      - name: Attest desktop release provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist-artifacts/*"
      - name: Cut GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Yaver Desktop GUI ${{ github.ref_name }}"
          body: |
            Native desktop host and control surface for Yaver. The embedded agent
            makes this machine a development node, while the same UI can explicitly
            target another paired box for runners, builds, and Browser Lane.

            ## Downloads
            - **macOS** — `yaver-gui-<version>-mac-arm64.dmg` or `-mac-x64.dmg` (signed + notarized)
            - **Windows** — published separately after Authenticode and clean-VM Store validation; the download page resolves the newest signed build
            - **Linux** — `yaver-gui-<version>-linux-<x64|arm64>.AppImage` · `.deb` · `.rpm` · `.tar.gz`

            apt-get (Debian/Ubuntu):
            ```
            wget <release_url>/download/gui/v<version>/yaver-gui-<version>-linux-x64.deb
            sudo apt-get install ./yaver-gui-<version>-linux-x64.deb
            ```
            The embedded agent means a fresh machine needs no npm/node install — the app
            carries `yaver serve` (with embedded hermesc) and self-provisions runners on demand.
            Verify downloads against `checksums.txt` or with
            `gh attestation verify <file> -R yaver-io/yaver.io`.

            See [yaver.io/download](https://yaver.io/download) for the landing page.
          files: dist-artifacts/*
