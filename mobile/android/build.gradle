// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath('com.google.gms:google-services:4.5.0')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    // Notifee ships its native core AAR inside the npm package rather than on
    // Maven Central. Its library plugin attempts to add this repository late,
    // which is too late for dependency resolution with the current Expo/AGP
    // stack. Keep the root build pointed at the operation's real artifact.
    maven { url "$rootDir/../node_modules/@notifee/react-native/android/libs" }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
