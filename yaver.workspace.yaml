# Yaver monorepo manifest — consumed by `yaver workspace init`.
# See desktop/agent/workspace.go for the parser + engine.
version: 1
name: yaver.io
workspace:
  root: .
  # auto → resolves to userSettings.primaryDeviceId (managed by
  # `yaver primary set/clear`). Pin to a specific deviceId to force
  # every `ops primary ...` on the monorepo to one machine.
  primary_device: auto
  relay: managed
  vault: local

apps:
  - name: backend
    path: ./backend
    stack: convex
    provider:
      deploy: convex-prod
    env:
      - CONVEX_URL
      - CONVEX_DEPLOY_KEY

  - name: web
    path: ./web
    stack: nextjs
    depends: [backend]
    provider:
      deploy: cloudflare
      analytics: plausible
    env:
      - CLOUDFLARE_API_TOKEN
      - CLOUDFLARE_ACCOUNT_ID
    development:
      targets:
        web:
          platform: web

  - name: mobile
    path: ./mobile
    stack: react-native-expo
    depends: [backend]
    provider:
      ios: testflight
      android: playstore
    env:
      - APPLE_TEAM_ID
      - APP_STORE_KEY_PATH
      - APP_STORE_KEY_ID
      - APP_STORE_KEY_ISSUER
    development:
      targets:
        ios:
          platform: ios
        android:
          platform: android

  - name: mobile-headless
    path: ./mobile-headless
    stack: bun
    depends: [mobile]

  # Standalone Apple/Android surfaces — declared as apps so the webui chat
  # composer + Load Targets can pick them and probe their WebRTC sim targets
  # (TV, watch, vision). Before 2026-08-12 these were missing from the
  # manifest, so /projects never offered them and "vibe the TV / watch /
  # AR-VR from the webui" was impossible: the project catalog feeds from the
  # manifest, and a non-repo dir like tvos/ was invisible. Stack swift keeps
  # them in the native-webrtc family (executionModeForFramework).
  # surfaces/test_surfaces (2026-08-13) let /workspace/apps and the webui
  # classify each app's WebRTC-streamable lane directly — the tvos app row is
  # TV, not "backend/tooling" — and pair with the agent's own Info.plist /
  # AndroidManifest.xml surface detection as the explicit declaration.
  - name: tvos
    path: ./tvos
    stack: swift
    surfaces: [tv]
    test_surfaces: [tvos-simulator]
    provider:
      ios: appstoreconnect
    depends: [backend]
    development:
      targets:
        tvos:
          platform: tvos

  - name: watchos
    path: ./watch
    stack: swift
    surfaces: [watch]
    test_surfaces: [watchos-simulator]
    provider:
      ios: appstoreconnect
    depends: [backend]
    development:
      targets:
        watchos:
          platform: watchos

  - name: visionos
    path: ./visionos
    stack: swift
    surfaces: [vision]
    test_surfaces: [visionos-simulator]
    provider:
      ios: appstoreconnect
    depends: [backend]
    development:
      targets:
        visionos:
          platform: visionos

  - name: wear-os
    path: ./wear
    stack: kotlin
    surfaces: [wear]
    test_surfaces: [android-wear]
    provider:
      android: playstore
    depends: [backend]
    development:
      targets:
        wear-os:
          platform: wear-os

  - name: androidtv
    path: ./androidtv
    stack: kotlin
    surfaces: [tv]
    test_surfaces: [android-tv]
    provider:
      android: playstore
    depends: [backend]
    development:
      targets:
        android-tv:
          platform: android-tv

  - name: xbox
    path: ./xbox
    stack: uwp
    surfaces: [xbox]
    test_surfaces: [webrtc, physical-hardware]
    depends: [backend]
    development:
      targets:
        xbox:
          platform: xbox

  # Public protocol/readiness boundary only. The restricted platform adapter
  # and SDK stay in the approved partner environment; the manifest makes the
  # required remote-box capabilities visible without claiming they exist.
  - name: playstation
    path: ./playstation
    stack: native-adapter
    surfaces: [playstation]
    test_surfaces: [webrtc, physical-hardware]
    depends: [backend]
    development:
      targets:
        ps4:
          platform: playstation4
        ps5:
          platform: playstation5

  - name: desktop-agent
    path: ./desktop/agent
    stack: go

  - name: desktop-installer
    path: ./desktop/installer
    stack: node

  - name: desktop-app
    path: ./desktop/app
    stack: node
    development:
      targets:
        windows-store:
          platform: windows

  - name: relay
    path: ./relay
    stack: go

  - name: cli
    path: ./cli
    stack: node

  - name: sdk-react-native
    path: ./sdk/feedback/react-native
    stack: node

  - name: sdk-flutter
    path: ./sdk/feedback/flutter
    stack: flutter

  - name: sdk-web
    path: ./sdk/feedback/web
    stack: node

  - name: sdk-js
    path: ./sdk/js
    stack: node

  - name: sdk-python
    path: ./sdk/python
    stack: python

  - name: sdk-flutter-main
    path: ./sdk/flutter
    stack: flutter

  - name: e2e
    path: ./e2e
    stack: node

shared:
  # Checked globally by `workspace init`. A missing value is a warning,
  # not a failure — releases need them but local builds often don't.
  env:
    - CONVEX_URL
    - CONVEX_DEPLOY_KEY
    - APPLE_TEAM_ID
    - CLOUDFLARE_API_TOKEN
  # Vault key glob: keys matching this pattern are considered shared
  # by every app. Follow-up: workspace engine injects them into each
  # app's runtime env when kicking actions.
  secrets:
    - yaver-*
